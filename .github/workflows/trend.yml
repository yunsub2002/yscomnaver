name: 트렌드 순위·블로그·SNS 자동 갱신

on:
  schedule:
    - cron: '7 * * * *'     # 매시간 7분: 실시간 순위 + 🔥 화제 글 + 인스타·스레드
    - cron: '23 22 * * *'   # 매일 07:23 (한국 시간) 오전 트렌드 글
    - cron: '23 3 * * *'    # 매일 12:23 (한국 시간) 점심 심층 분석 글 + 인스타 카드뉴스·스레드
    - cron: '23 8 * * *'    # 매일 17:23 (한국 시간) 오후 트렌드 글
  workflow_dispatch:
    inputs:
      mode:
        description: 'hot = 화제 글(+인스타·스레드) / deep = 심층 글(+인스타·스레드) / post = 트렌드 글 / rank = 순위만'
        type: choice
        default: hot
        options: [hot, deep, post, rank]

permissions:
  contents: write

concurrency:
  group: trend
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 브라우저 캐시 (이미지 디자인용)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: 한글·이모지 글꼴 · 이미지 디자인 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          pip install -q pillow playwright
          python -m playwright install --with-deps chromium
      - name: 순위 · 글 · SNS 콘텐츠 만들기
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7 * * * *' && 'hot') || (github.event.schedule == '23 3 * * *' && 'deep') || 'post' }}
        run: python trend_bot/make_post.py --out .
      - name: 저장소에 올리기 (대시보드 자동 반영 · 모든 기록 축적)
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "바뀐 내용 없음"; exit 0; }
          git commit -q -m "갱신 ${MODE:-} $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*7))
          done
          exit 1
