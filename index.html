<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="트렌드 블로그">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>트렌드 블로그 도우미</title>
<style>
:root{
 --bg:#f5f6fa;--card:#ffffff;--ink:#141a26;--mut:#6b7385;--line:#e6e9f0;--soft:#f0f2f7;
 --acc:#03c75a;--acc-ink:#ffffff;--acc-soft:#e6f9ee;--hot:#ff5b36;--blue:#2f6bff;--blue-soft:#eaf0ff;
 --up:#e5484d;--down:#2f6bff;--new:#03a54b;--shadow:0 1px 2px rgba(20,26,38,.06),0 4px 14px rgba(20,26,38,.05);
 --tab:rgba(255,255,255,.88)
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0f1420;--card:#181f2e;--ink:#eef1f7;--mut:#98a1b5;--line:#273044;--soft:#202839;
 --acc:#1ed36f;--acc-ink:#05200f;--acc-soft:#173326;--hot:#ff7a5c;--blue:#7aa2ff;--blue-soft:#1f2a45;
 --up:#ff6b6f;--down:#7aa2ff;--new:#3ddc84;--shadow:none;--tab:rgba(24,31,46,.9)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(84px + env(safe-area-inset-bottom)) env(safe-area-inset-left);overscroll-behavior-y:contain}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
a{color:var(--blue)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:0;flex:1}
.upd{font-size:13px;color:var(--mut);margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px}
.iconbtn.spin span{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mut)}
.chip.todo{background:#fff1ec;color:var(--hot)}.chip.done{background:var(--acc-soft);color:var(--new)}
@media (prefers-color-scheme:dark){.chip.todo{background:#3a2320}}
.ptitle{font-size:19px;font-weight:800;line-height:1.4;margin:10px 0 12px;letter-spacing:-.2px;word-break:keep-all}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border-radius:14px;background:var(--soft);font-weight:700;font-size:15px;padding:0 10px;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.97);opacity:.85}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.blue{background:var(--blue-soft);color:var(--blue)}
.btn.wide{grid-column:1/-1}
.btn small{font-weight:600;opacity:.7;font-size:12px}
.photos{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.ph{flex:0 0 72%;scroll-snap-align:start;position:relative}
.ph img{width:100%;height:auto;border-radius:14px;display:block;background:var(--soft);aspect-ratio:1/1}
.today{display:flex;gap:8px;overflow-x:auto;margin:4px -16px 0;padding:2px 16px 6px;scrollbar-width:none}.today::-webkit-scrollbar{display:none}
.tbtn{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 13px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:13.5px;font-weight:800;min-width:118px;text-align:left;border:2px solid transparent}
.tbtn small{font-size:11.5px;font-weight:700;color:var(--mut)}.tbtn.on{border-color:var(--acc)}.tbtn.done small{color:var(--new)}
.tag-x{font-size:11px;font-weight:800;color:var(--mut);background:var(--soft);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.ph.tall{flex-basis:58%}.ph.tall img{aspect-ratio:4/5}
.ph .n{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.sec-t{font-size:13px;font-weight:800;color:var(--mut);margin:18px 2px 8px;letter-spacing:.2px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.steps li:last-child{border:0}
.steps li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.preview{font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.preview h3{font-size:17px;margin:20px 0 6px}.preview h4{font-size:16px;margin:16px 0 4px}
.preview p{margin:0 0 6px;min-height:.6em}.preview .ph-mark{background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:13.5px;border-radius:10px;padding:8px 12px;margin:6px 0}.preview table{border-collapse:collapse;font-size:13px;margin:6px 0 10px;width:100%}.preview th,.preview td{border:1px solid var(--line);padding:5px 6px;text-align:left}.preview ul{margin:2px 0 10px;padding-left:18px}.preview li{margin:3px 0;font-size:14px}
details.more summary{list-style:none;font-weight:800;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more summary:after{content:"펼치기";font-size:13px;color:var(--blue);font-weight:700}
details.more[open] summary:after{content:"접기"}
.donebtn{width:100%;min-height:56px;border-radius:16px;font-size:16.5px;font-weight:800;background:var(--ink);color:var(--bg);margin-top:4px}
.donebtn.on{background:var(--acc-soft);color:var(--new)}
/* 순위 */
.rk{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rk:last-child{border:0}
.rk .no{width:26px;font-size:19px;font-weight:900;text-align:center;color:var(--mut);flex:none}
.rk .no.top{color:var(--hot)}
.rk .kw{flex:1;min-width:0}
.rk .kw b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .kw span{font-size:12.5px;color:var(--mut)}
.mv{font-size:12.5px;font-weight:800;min-width:44px;text-align:right;flex:none}
.mv.up{color:var(--up)}.mv.down{color:var(--down)}.mv.new{color:var(--new)}.mv.same{color:var(--mut)}
.news{padding:2px 2px 12px 38px;border-bottom:1px solid var(--line);font-size:14px}
.news a{display:block;padding:5px 0;text-decoration:none;color:var(--ink)}
.news a small{color:var(--mut)}
.news .q{display:inline-block;margin-top:4px;font-weight:700;color:var(--new);text-decoration:none}
/* 지난 글 */
.arc{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.arc:last-child{border:0}
.arc img{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft)}
.arc .t{flex:1;min-width:0;font-size:14.5px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.arc .s{font-size:12px;color:var(--mut);font-weight:600}
/* 탭바 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tab);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;font-size:11.5px;font-weight:700;color:var(--mut)}
nav button i{font-style:normal;font-size:22px;line-height:1.2;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--ink)}nav button.on i{filter:none;opacity:1}
nav .dot{position:absolute;margin:2px 0 0 22px;width:8px;height:8px;border-radius:50%;background:var(--hot)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(20,26,38,.92);color:#fff;padding:11px 18px;border-radius:99px;font-size:14.5px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:15px}
.note{font-size:12.5px;color:var(--mut);margin:8px 2px 0}
[hidden]{display:none!important}
nav button{font-size:10.5px}nav button i{font-size:21px}
.feed{display:flex;flex-direction:column;gap:0}
.sc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sc-head .t{flex:1;min-width:0;font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{white-space:pre-wrap;font-size:14.5px;line-height:1.6;background:var(--soft);border-radius:14px;padding:12px 14px;max-height:9.6em;overflow:hidden;position:relative}
.cap.open{max-height:none}
.cap-more{font-size:13px;font-weight:800;color:var(--blue);margin:6px 2px 10px;display:inline-block}
.thp{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.thp:last-child{border:0}
.thp .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.thp .x{flex:1;white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.thp button{flex:none;font-size:12.5px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:10px;padding:6px 10px}
.mini{display:flex;gap:6px;overflow-x:auto;margin:10px -16px;padding:0 16px;scrollbar-width:none}.mini::-webkit-scrollbar{display:none}
.mini img{height:150px;border-radius:12px;flex:none;background:var(--soft)}
.filters{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
.filters select,.filters input{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 11px}
.filters input{flex:1;min-width:140px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin:6px 0}.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:13.5px;font-weight:800;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.ok-chip{font-size:12px;font-weight:800;color:var(--new)}
/* 바로 글쓰기 */
.rkw{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.rkw .rk{border:0;flex:1;min-width:0}
.gq{flex:none;font-size:13px;font-weight:800;padding:8px 11px;border-radius:12px;background:linear-gradient(90deg,#ff5b36,#ffaa2b);color:#fff;white-space:nowrap}
.gtip{font-size:13.5px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:10px 14px;margin-top:6px;color:var(--mut)}.gtip b{color:var(--hot)}
#gen{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(30px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
#gen .gh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 8px}
#gen .gh b{flex:1;min-width:0;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gseg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin:8px 0}
.gseg button{flex:1;padding:9px 0;border-radius:10px;font-size:14px;font-weight:800;color:var(--mut)}
.gseg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.gtxt{white-space:pre-wrap;font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.gimgs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}.gimgs::-webkit-scrollbar{display:none}
.gimgs img{flex:0 0 62%;width:62%;border-radius:14px;display:block;background:var(--soft)}
.gwarn{font-size:13px;font-weight:700;color:var(--hot);margin:8px 2px 0}
/* 키즈 탭 */
.kpgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.kp{background:var(--soft);border-radius:14px;overflow:hidden;position:relative}
.kp img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.kp .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:800;border-radius:99px;padding:2px 8px}
.kp .cv{position:absolute;right:6px;top:6px;background:#ff7a45;color:#fff;font-size:11px;font-weight:900;border-radius:99px;padding:2px 7px}
.kp input{border:0!important;border-radius:0!important;font-size:14px!important;padding:8px 10px!important;background:var(--card)!important}
.kp .tools{display:flex;border-top:1px solid var(--line)}
.kp .tools button{flex:1;padding:7px 0;font-size:14px;font-weight:800;color:var(--mut)}
.kform .kpadd{display:flex;align-items:center;justify-content:center;font-size:15px;margin:8px 0 0;color:var(--blue)}
.kpadd{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:54px;border-radius:14px;border:2px dashed var(--line);font-weight:800;font-size:15px;color:var(--blue);background:var(--blue-soft)}
.kchips{display:flex;gap:6px;overflow-x:auto;margin:6px -16px 2px;padding:2px 16px 6px;scrollbar-width:none}.kchips::-webkit-scrollbar{display:none}
.kchips button{flex:none;font-size:13.5px;font-weight:800;padding:7px 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);color:var(--mut)}
.kchips button.on{background:#ff7a45;color:#fff}
.kn{padding:12px 0;border-bottom:1px solid var(--line)}.kn:last-child{border:0}
.kn .kt{display:block;font-size:15.5px;font-weight:800;line-height:1.45;color:var(--ink);text-decoration:none;word-break:keep-all}
.kn .km{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:3px}
.kn .ka{display:flex;gap:6px;margin-top:8px}
.kn .ka a,.kn .ka button{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:10px;background:var(--soft);color:var(--ink);text-decoration:none}
.kn .ka .go{background:linear-gradient(90deg,#ff7a45,#ffb347);color:#fff}
.knew{font-size:10.5px;font-weight:900;color:#fff;background:#ff7a45;border-radius:6px;padding:1px 5px;margin-right:4px;vertical-align:2px}
.kf{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.kf:last-child{border:0}
.kf img,.kf .noimg{flex:none;width:84px;height:84px;border-radius:14px;object-fit:cover;background:linear-gradient(135deg,#ffe8cc,#e5dbff);display:grid;place-items:center;font-size:34px}
.kf .b{flex:1;min-width:0}.kf .b b{display:block;font-size:15.5px;line-height:1.4}
.kf .tip{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.45}
.kst{display:inline-block;font-size:11px;font-weight:900;padding:2px 7px;border-radius:6px;background:#fff1e6;color:#e8590c;margin-left:4px;vertical-align:2px}
@media (prefers-color-scheme:dark){.kst{background:#3a2516}}
.kform label{display:block;font-size:13px;font-weight:800;color:var(--mut);margin:12px 2px 5px}
.kform input,.kform select,.kform textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px}
.kform textarea{min-height:76px;resize:vertical}
.kstar{display:flex;gap:4px}.kstar button{font-size:28px;filter:grayscale(1);opacity:.35}.kstar button.on{filter:none;opacity:1}
.kbox{background:linear-gradient(135deg,#fff4e6,#f3f0ff);border-radius:16px;padding:12px 14px;font-size:13.5px;color:#5f3d7a;margin:8px 0}
@media (prefers-color-scheme:dark){.kbox{background:#2a2236;color:#d0bfff}}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div class="hrow">
   <div style="flex:1;min-width:0"><h1 id="htitle">블로그</h1><div class="upd" id="upd">불러오는 중…</div></div>
   <button class="iconbtn" id="refresh" aria-label="새로고침"><span>↻</span></button>
  </div>
 </header>
 <main id="v-post"></main>
 <main id="v-hot" hidden></main>
 <main id="v-kids" hidden></main>
 <main id="v-insta" hidden></main>
 <main id="v-threads" hidden></main>
 <main id="v-rank" hidden></main>
 <main id="v-arc" hidden></main>
</div>

<nav><div class="in">
 <button data-v="post" class="on"><i>📝</i>블로그<span class="dot" id="dot" hidden></span></button>
 <button data-v="hot"><i>🔥</i>화제</button>
 <button data-v="kids"><i>👧</i>키즈</button>
 <button data-v="insta"><i>📸</i>인스타</button>
 <button data-v="threads"><i>🧵</i>스레드</button>
 <button data-v="rank"><i>📈</i>순위</button>
 <button data-v="arc"><i>🗂</i>보관함</button>
</div></nav>
<div id="gen" hidden><div class="wrap">
 <div class="gh"><button class="iconbtn" data-g="close" aria-label="닫기"><span>✕</span></button><b id="gk"></b><button class="iconbtn" data-g="again" aria-label="다른 버전"><span>🔄</span></button></div>
 <div class="gseg" id="gspice"><button data-g="mild">😌 정보형</button><button data-g="hot">🔥 자극형</button></div>
 <div class="gimgs" id="gimgs"></div>
 <div class="btns" style="margin-top:8px"><button class="btn pri wide" data-g="photos">📥 카드 이미지 3장 저장</button></div>
 <div class="gseg" id="gtab" style="margin-top:14px"><button data-g="t-blog">📝 블로그</button><button data-g="t-threads">🧵 스레드</button><button data-g="t-insta">📸 인스타</button></div>
 <div id="gout"></div>
 <p class="note">🔄 를 누를 때마다 제목·문장·이미지 색이 다른 버전으로 새로 만들어져요. 기사 내용은 올리기 전에 원문으로 한 번 확인하세요.</p>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== 설정 ===== */
const REPO = 'yunsub2002/yscomnaver', BRANCH = 'main';
const RAW = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;
const LINKS = {blog: 'https://m.blog.naver.com/', insta: 'https://www.instagram.com/', threads: 'https://www.threads.net/'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = {posts: [], rank: null, view: 'post', sel: {post: null, hot: null, kids: null}, cur: {}, kids: null, kseg: 'live', kcat: 'all', files: {}, insta: null, threads: null,
           months: [], arc: {month: '', kind: 'all', q: '', list: null}, social: {insta: '', threads: ''}};
const TITLES = {post: '블로그', hot: '🔥 화제 글', kids: '👧 키즈 실시간', insta: '📸 인스타', threads: '🧵 스레드', rank: '실시간 순위', arc: '보관함'};

/* ===== 이 아이폰에만 저장: 올린 기록 ===== */
const store = {
 get(){ try { return JSON.parse(localStorage.getItem('posted') || '{}') } catch(e){ return {} } },
 set(v){ try { localStorage.setItem('posted', JSON.stringify(v)) } catch(e){} },
 toggle(id){ const s = this.get(); if (s[id]) delete s[id]; else s[id] = new Date().toISOString(); this.set(s); return !!s[id]; }
};

/* ===== 데이터 불러오기 ===== */
async function load(path){
 const bust = '?t=' + Math.floor(Date.now() / 60000);
 for (const base of [RAW, '']) {
  try { const r = await fetch(base + path + bust, {cache: 'no-store'}); if (r.ok) { const j = await r.json(); S.base = base; return j; } } catch(e){}
 }
 throw new Error(path);
}
const img = p => (S.base ?? RAW) + p;
const isHot = x => (x.kind || '') === 'hot';
const isKids = x => (x.kind || '') === 'kids';
const blogPosts = () => S.posts.filter(x => !isHot(x) && !isKids(x));
const kidsPosts = () => S.posts.filter(isKids);
const hotPosts = () => S.posts.filter(isHot);

async function refresh(){
 const b = $('#refresh'); b.classList.add('spin');
 try {
  const [posts, rank, months] = await Promise.all([load('data/posts.json').catch(() => []), load('data/rank.json').catch(() => null), load('data/archive/index.json').catch(() => [])]);
  S.posts = posts; S.rank = rank; S.months = months; S.insta = S.threads = S.kids = null; S.cur = {};
  await ensureView();
  render();
 } catch(e) { $('#upd').textContent = '불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.'; }
 b.classList.remove('spin');
}

/* 화면에 필요한 데이터만 그때그때 불러오기 */
async function ensureView(){
 const v = S.view;
 if (v === 'post' || v === 'hot') {
  const list = v === 'post' ? todays(blogPosts()) : todays(hotPosts());
  const id = S.sel[v] || pickDefault(list, v === 'hot');
  if (id && (!S.cur[v] || S.cur[v].id !== id)) S.cur[v] = await load(`data/posts/${id}.json`).catch(() => null);
  if (!id) S.cur[v] = null;
 }
 if (v === 'kids') {
  if (!S.kids) S.kids = await load('data/kids.json').catch(() => ({}));
  if (S.kseg === 'post') {
   const id = S.sel.kids || pickDefault(todays(kidsPosts()), true);
   if (id && (!S.cur.kids || S.cur.kids.id !== id)) S.cur.kids = await load(`data/posts/${id}.json`).catch(() => null);
   if (!id) S.cur.kids = null;
  }
 }
 if ((v === 'insta' || v === 'threads') && !S[v]) {
  const m = S.social[v];
  S[v] = m ? (await load(`data/social/archive/${v}-${m}.json`).catch(() => [])).slice().reverse() : await load(`data/social/${v}.json`).catch(() => []);
 }
 if (v === 'arc' && !S.arc.list) {
  if (!S.arc.month) S.arc.month = S.months[0] || '';
  S.arc.list = S.arc.month ? (await load(`data/archive/${S.arc.month}.json`).catch(() => [])).slice().reverse() : S.posts;
 }
}

/* ===== 날짜 · 시간 ===== */
function todays(list){
 if (!list.length) return [];
 const day = list[0].id.slice(0, 8);
 return list.filter(x => x.id.slice(0, 8) === day).sort((a, b) => a.created < b.created ? -1 : 1);
}
function pickDefault(list, newestFirst){
 const done = store.get(), l = newestFirst ? list.slice().reverse() : list;
 const x = l.find(p => !done[p.id]) || l[l.length - 1];
 return x && x.id;
}
const kindLabel = x => x.label || (x.id.endsWith('-am') ? '오전 트렌드' : x.id.endsWith('-pm') ? '오후 트렌드' : '글');
function when(iso){
 if (!iso) return '';
 const d = new Date(iso), now = new Date(), m = Math.round((now - d) / 60000);
 const hm = d.toLocaleTimeString('ko-KR', {hour: 'numeric', minute: '2-digit'});
 if (m < 1) return '방금';
 if (m < 60) return `${m}분 전`;
 if (d.toDateString() === now.toDateString()) return `오늘 ${hm}`;
 return `${d.getMonth() + 1}월 ${d.getDate()}일 ${hm}`;
}

/* ===== 화면 그리기 ===== */
function render(){
 const posted = store.get(), v = S.view;
 $('#dot').hidden = !todays(blogPosts()).some(x => !posted[x.id]);
 $('#htitle').textContent = TITLES[v];
 const up = {post: S.cur.post ? `글 만든 시각 ${when(S.cur.post.created)} · 하루 3편 (오전 트렌드·점심 심층·오후 트렌드)` : '아직 만들어진 글이 없어요',
             hot: `매시간 지금 막 뜬 키워드로 자동 작성 · 최근 ${when((hotPosts()[0] || {}).created) || '-'}`,
             kids: S.kids && S.kids.updated ? `소식 업데이트 ${when(S.kids.updated)} · 화제 글 약 3시간마다 · 정리 글 매일 아침` : '아이랑 갈 만한 축제·행사·키즈카페·맛집·유행 소식',
             insta: '심층 글은 카드뉴스, 화제 글은 이슈 카드로 자동 제작', threads: '첫 줄 후킹 → 내용 → 질문 순서의 연속 글',
             rank: S.rank ? `순위 업데이트 ${when(S.rank.updated)} · 매시간 갱신` : '', arc: '만들어진 모든 글이 월별로 계속 쌓여요'}[v];
 $('#upd').textContent = up;
 ['post', 'hot', 'kids', 'insta', 'threads', 'rank', 'arc'].forEach(x => $('#v-' + x).hidden = x !== v);
 document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
 if (v === 'post') drawPost('post', todays(blogPosts()), posted);
 if (v === 'hot') drawPost('hot', todays(hotPosts()).slice().reverse(), posted);
 if (v === 'kids') drawKids(posted);
 if (v === 'insta') drawSocial('insta', posted);
 if (v === 'threads') drawSocial('threads', posted);
 if (v === 'rank') drawRank();
 if (v === 'arc') drawArc(posted);
}

}

   <a class="q" href="https://m.search.naver.com/search.naver?query=${encodeURIComponent(x.keyword)}" target="_blank" rel="noopener">네이버에서 ‘${esc(x.keyword)}’ 검색 →</a></div>`).join('')}
 </div><p class="note">검색어를 누르면 관련 기사가 열려요. ▲▼ 는 직전 갱신과 비교한 변화예요. ‘민감’은 사건·사고·재판·정치 관련이라 자동 글에서는 빼는 키워드예요(직접 쓸 때는 사실 확인 필수).</p>`;

const HANGUL = /[\uac00-\ud7a3]/, LATIN = /^[A-Za-z0-9 .,&+'\-]+$/;
function isKo(x){ const k = x.keyword || ''; if (HANGUL.test(k)) return true; return LATIN.test(k) && (x.news || []).some(n => HANGUL.test(n.title || '')); }

/* ===== 복사 ===== */
async function copy(text, what){
 let ok = false;
 try { await navigator.clipboard.writeText(text); ok = true; } catch(e) {
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px'; document.body.appendChild(ta);
  const r = document.createRange(); r.selectNodeContents(ta); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); ta.remove();
 }
 toast(ok ? `${what} 복사했어요` : '복사하지 못했어요. 길게 눌러 복사해 주세요.');
}

/* ===== 사진 저장 (공유 시트 → 안 되면 새 탭) ===== */
async function getFiles(key, paths){
 if (S.files[key]) return S.files[key];
 S.files[key] = await Promise.all(paths.map(async (s, i) => {
  const b = await (await fetch(img(s))).blob();
  const ext = (s.split('.').pop() || 'jpg').toLowerCase();
  return new File([b], `${key}-${i + 1}.${ext}`, {type: b.type || (ext === 'png' ? 'image/png' : 'image/jpeg')});
 }));
 return S.files[key];
}
async function savePhotos(key, paths){
 const had = !!S.files[key];
 let files = null;
 try { files = await getFiles(key, paths); } catch(e) {}
 if (files && navigator.canShare && navigator.canShare({files})) {
  try { await navigator.share({files}); return; }
  catch(e) { if (e.name === 'AbortError') return; if (!had) { toast('사진 준비 완료! 한 번 더 눌러 주세요'); return; } }
 }
 paths.forEach(s => window.open(img(s), '_blank'));
 toast('사진을 길게 눌러 ‘사진 앱에 저장’을 고르세요');
}
let tt;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1900); }

/* ===== 버튼 처리 ===== */
document.addEventListener('click', async e => {
 const nb = e.target.closest('nav button');
